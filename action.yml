name: "FedCLI — Run Database SQL"
description: "Run database SQL checks and checked-in scripts with FedCLI in GitHub Actions."
author: "ApplexTech"
branding:
  icon: "database"
  color: "orange"

inputs:
  connection-url:
    description: "Optional database connection URL. Store credentials in GitHub Secrets; never inline them in workflows."
    required: false
  sql:
    description: "SQL command or semicolon-delimited command sequence. Provide exactly one of sql or script."
    required: false
  script:
    description: "Checked-in SQL script path relative to working-directory. Provide exactly one of sql or script."
    required: false
  working-directory:
    description: "Repository directory containing script. Defaults to the repository root."
    required: false
    default: "."

runs:
  using: "docker"
  image: "Dockerfile"
