name: "FedCLI - Universal Database Automation"
description: "Run FedCLI, a universal database CLI, for federation, automation, and checks in GitHub Actions."
author: "ApplexTech"
branding:
  icon: "database"
  color: "orange"

inputs:
  connection-url:
    description: "Optional database connection URL. Store credentials in GitHub Secrets; never inline them in workflows."
    required: false
  sql:
    description: "FedCLI command or semicolon-delimited SQL command sequence. Provide exactly one of sql or script."
    required: false
  script:
    description: "Checked-in FedCLI or SQL script path relative to working-directory. Provide exactly one of sql or script."
    required: false
  working-directory:
    description: "Repository directory containing script. Defaults to the repository root."
    required: false
    default: "."

runs:
  using: "docker"
  image: "Dockerfile"
