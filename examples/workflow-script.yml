name: Run a checked-in FedCLI script

on:
  workflow_dispatch:

jobs:
  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run the script
        uses: ronwarshawsky/fedcli-action@v1
        with:
          connection-url: ${{ secrets.FEDCLI_CONNECTION_URL }}
          script: ops/check.sql
